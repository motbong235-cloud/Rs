# RS-PREMIUM Shop Bot — Render Blueprint
# Dashboard: New → Blueprint → connect this repo
# Or: New → Web Service → root = this folder

services:
  - type: web
    name: rs-premium-bot
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: STORE_NAME
        value: RS-PREMIUM
      - key: DATA_DIR
        value: /var/data
      - key: CAMRAPIDPAY_API_KEY
        sync: false
      - key: CAMRAPID_CREATE_URL
        sync: false
      - key: CAMRAPID_CHECK_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ABA_API_KEY
        sync: false
      - key: ABA_MERCHANT_ID
        sync: false
      - key: ABA_BASE_URL
        value: https://khmer-system.com
      - key: LOW_STOCK_THRESHOLD
        value: "3"
      - key: NOTIFY_CHAT_IDS
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
